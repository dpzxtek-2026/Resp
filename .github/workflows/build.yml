name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen
      uses: actions/checkout@v4

    - name: Java instellen voor de APK file (JAVA VERSION BY DPZX)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # We navigeren direct naar de app-map en bouwen daar met het standaard gradle-commando
    - name: APK Builden (Release)
      run: |
        cd app
        gradle assembleRelease

    - name: Release APK Opslaan als Download
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/app/build/outputs/apk/release/

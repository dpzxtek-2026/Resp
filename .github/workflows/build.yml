name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen
      uses: actions/checkout@v4

    - name: Java instellen
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # We maken de sleutel nu direct aan in de app-map zelf
    - name: Debug Keystore Genereren
      run: |
        keytool -genkeypair -v \
          -keystore ./app/debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"

    - name: APK Builden
      env:
        GRADLE_OPTS: -Djava.awt.headless=true
      run: |
        cd app
        gradle assembleDebug

    - name: APK Opslaan als Download
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/app/build/outputs/apk/debug/

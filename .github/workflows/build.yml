name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen
      uses: actions/checkout@v4

    - name: Java instellen
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # We maken een leeg nepbestand aan zodat Gradle niet crasht op de controle
    - name: Nep Keystore Aanmaken
      run: touch /home/runner/work/Resp/Resp/my-upload-key.jks

    - name: APK Builden (Release)
      run: |
        cd app
        gradle assembleRelease -Pandroid.injected.signing.config.file=debug.keystore

    - name: Release APK Opslaan als Download
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/app/build/outputs/apk/release/

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen
      uses: actions/checkout@v4

    - name: Java instellen
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # We bouwen een Debug APK om alle wachtwoord-verplichtingen te omzeilen
    - name: APK Builden
      run: |
        cd app
        gradle assembleDebug

    - name: APK Opslaan als Download
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/app/build/outputs/apk/debug/
